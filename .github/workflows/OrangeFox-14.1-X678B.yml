name: OrangeFox 14.1 - Infinix X678B (Universal Android 12-17 / Infinity-X 17.0)

on:
  workflow_dispatch:
    inputs:
      FOX_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '14.1'
        type: choice
        options:
          - '14.1'
          - '12.1'
      COMMON_BRANCH:
        description: 'Transsion MT6789 Common Tree Branch'
        required: true
        default: 'fox_12.1-tranos15'
        type: choice
        options:
          - 'fox_12.1-tranos15'
          - 'fox_12.1'

permissions:
  contents: write

jobs:
  build:
    name: Build OrangeFox ${{ inputs.FOX_BRANCH || '14.1' }} (Infinix-X678B)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FOX_BRANCH: ${{ inputs.FOX_BRANCH || '14.1' }}
      COMMON_BRANCH: ${{ inputs.COMMON_BRANCH || 'fox_12.1-tranos15' }}
      COMMON_REPO: 'https://github.com/transsion-mt6789-recovery/twrp-device_transsion_mt6789-common.git'
      MODULES_REPO: 'https://github.com/akifakif32/android_device_infinix_X678B-kernel.git'
      MODULES_BRANCH: 'sixteen-mck'
      FOX_ROOT: '${{ github.workspace }}/OrangeFox/fox_${{ inputs.FOX_BRANCH || ''14.1'' }}'
      DEVICE_PATH: 'device/infinix/Infinix-X678B'
      COMMON_PATH: 'device/transsion/mt6789-common'
      PRODUCT_NAME: 'twrp_X678B'
      DEVICE_NAME: 'Infinix-X678B'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: repo_self

      - name: Free runner disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Configure 24GB Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt -y upgrade
          git clone --depth=1 https://gitlab.com/OrangeFox/misc/scripts "$RUNNER_TEMP/orangefox-scripts"
          cd "$RUNNER_TEMP/orangefox-scripts"
          sudo bash setup/android_build_env.sh

      - name: Sync OrangeFox source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"
          cd "$GITHUB_WORKSPACE/OrangeFox"
          git config --global user.name 'OrangeFox Builder'
          git config --global user.email 'orangefox-builder@users.noreply.github.com'
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$FOX_ROOT"

      - name: Setup Device Tree, Common Tree & Latest Modules (17.0 / sixteen-mck)
        shell: bash
        run: |
          set -euo pipefail
          cd "$FOX_ROOT"

          # 1. Clone Transsion MT6789 Common Recovery Tree
          rm -rf "$COMMON_PATH"
          git clone --depth=1 -b "$COMMON_BRANCH" "$COMMON_REPO" "$COMMON_PATH"

          # --- Sanitize mt6789-common for Android 14 (fox_14.1) & Clang 17 compatibility ---

          # Fix 1a: In common.mk, make all inherit-product calls optional, drop ROM-only/obsolete
          # product makefiles (gsi_keys.mk, compression.mk, emulated_storage.mk, launch_with_vendor_ramdisk.mk),
          # remove hardcoded PRODUCT_TARGET_VNDK_VERSION := 31 (absent in fox_14.1), remove broken
          # TW_RECOVERY_ADDITIONAL_RELINK_LIBRARY_FILES, and ensure bootctl is in PRODUCT_PACKAGES
          sed -i 's/inherit-product,/inherit-product-if-exists,/g' "$COMMON_PATH/common.mk"
          sed -i -E '/gsi_keys\.mk/d; /emulated_storage\.mk/d; /virtual_ab_ota\//d' "$COMMON_PATH/common.mk"
          sed -i '/PRODUCT_TARGET_VNDK_VERSION/d' "$COMMON_PATH/common.mk"
          sed -i '/TW_RECOVERY_ADDITIONAL_RELINK_LIBRARY_FILES/,+1d' "$COMMON_PATH/common.mk"
          sed -i 's/PRODUCT_PACKAGES_DEBUG/PRODUCT_PACKAGES/g' "$COMMON_PATH/common.mk"

          # Fix 1b: In BoardConfigCommon.mk, fix BOARD_STSTEMIMAGE typo, remove RECOVERY_BINARY_SOURCE_FILES
          # for debuggerd/strace, remove TW_INCLUDE_LPTOOLS/TW_INCLUDE_FB2PNG (absent in fox_14.1 minimal manifest),
          # remove nested quotes in BOARD_MKBOOTIMG_ARGS (--board ""), and define OF_DEFAULT_KEYMASTER_VERSION := 4.1
          sed -i 's/BOARD_STSTEMIMAGE_FILE_SYSTEM_TYPE/BOARD_SYSTEMIMAGE_FILE_SYSTEM_TYPE/g' "$COMMON_PATH/BoardConfigCommon.mk"
          sed -i 's/ --board ""//g' "$COMMON_PATH/BoardConfigCommon.mk"
          sed -i '/RECOVERY_BINARY_SOURCE_FILES/d; /debuggerd/d; /strace/d' "$COMMON_PATH/BoardConfigCommon.mk"
          sed -i '/TW_INCLUDE_LPTOOLS/d; /TW_INCLUDE_FB2PNG/d' "$COMMON_PATH/BoardConfigCommon.mk"
          cat >> "$COMMON_PATH/BoardConfigCommon.mk" <<'EOF'

          # OrangeFox 14.1 Keymaster & Lptools compatibility
          OF_DEFAULT_KEYMASTER_VERSION := 4.1
          TW_EXCLUDE_LPTOOLS := true
          EOF

          # Fix 1c: In bootctrl, remove undefined device_kernel_headers dependency, add -Wno-error,
          # and add <stdio.h>/<unistd.h> required by Android 14 libc++
          cat > "$COMMON_PATH/bootctrl/Android.bp" <<'EOF'
          cc_library_shared {
              name: "android.hardware.boot@1.2-mtkimpl",
              stem: "android.hardware.boot@1.0-impl-1.2-mtkimpl",
              defaults: [
                  "hidl_defaults",
                  "libboot_control_defaults",
              ],
              cflags: [
                  "-Wno-error",
              ],
              relative_install_path: "hw",
              vendor: true,
              recovery_available: true,
              srcs: ["BootControl.cpp", "boot_region_control.cpp"],
              shared_libs: [
                  "libbase",
                  "libcutils",
                  "liblog",
                  "libhidlbase",
                  "libhardware",
                  "libutils",
                  "android.hardware.boot@1.0",
                  "android.hardware.boot@1.1",
                  "android.hardware.boot@1.2",
              ],
              static_libs: [
                  "libboot_control",
                  "libfstab",
              ],
          }
          EOF
          sed -i '1i #include <stdio.h>\n#include <unistd.h>' "$COMMON_PATH/bootctrl/boot_region_control.cpp"

          # Fix 1d: In mtk_plpath_utils, link libdm + libext2_uuid statically (libdm is static-only in A14 recovery)
          # and add <errno.h>/<string.h>
          cat > "$COMMON_PATH/mtk_plpath_utils/Android.bp" <<'EOF'
          cc_binary {
              name: "mtk_plpath_utils",
              srcs: ["mtk_plpath_utils.cpp"],
              cflags: [
                  "-Wno-error",
              ],
              recovery_available: true,
              static_libs: [
                  "libdm",
                  "libext2_uuid",
              ],
              shared_libs: [
                  "libbase",
                  "libcutils",
                  "liblog",
                  "libutils",
              ],
          }
          EOF
          sed -i '1i #include <errno.h>\n#include <string.h>' "$COMMON_PATH/mtk_plpath_utils/mtk_plpath_utils.cpp"

          # 2. Place our unified Infinix-X678B Device Tree
          rm -rf "$DEVICE_PATH"
          mkdir -p "$(dirname "$DEVICE_PATH")"
          if [ -d "$GITHUB_WORKSPACE/repo_self/device/infinix/Infinix-X678B" ]; then
            cp -a "$GITHUB_WORKSPACE/repo_self/device/infinix/Infinix-X678B" "$DEVICE_PATH"
          else
            cp -a "$GITHUB_WORKSPACE/repo_self" "$DEVICE_PATH"
            rm -rf "$DEVICE_PATH/.git" "$DEVICE_PATH/.github"
          fi

          # Remove legacy omni_Infinix-X678B.mk (hyphen in product name breaks Android 14 envsetup.mk parser)
          rm -f "$DEVICE_PATH/omni_Infinix-X678B.mk"
          if [ "$FOX_BRANCH" = "14.1" ]; then
            cat > "$DEVICE_PATH/AndroidProducts.mk" <<'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_X678B.mk

          COMMON_LUNCH_CHOICES := \
              twrp_X678B-ap2a-eng
          EOF
          else
            cat > "$DEVICE_PATH/AndroidProducts.mk" <<'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_X678B.mk

          COMMON_LUNCH_CHOICES := \
              twrp_X678B-eng
          EOF
          fi

          # 3. Sync latest kernel ramdisk .ko modules & DTB from akifakif32 (17.0 / sixteen-mck)
          #    Preserve our topologically-sorted modules.load, modules.load.recovery, and modules.softdep for 68W FastCharge
          git clone --depth=1 -b "$MODULES_BRANCH" "$MODULES_REPO" "$RUNNER_TEMP/akif_kernel"
          mkdir -p "$DEVICE_PATH/prebuilt" "$DEVICE_PATH/recovery/root/lib/modules"
          cp -f "$RUNNER_TEMP/akif_kernel/dtb/mt6789.dtb" "$DEVICE_PATH/prebuilt/dtb.img"
          cp -f "$RUNNER_TEMP/akif_kernel/ramdisk/"*.ko "$DEVICE_PATH/recovery/root/lib/modules/"
          cp -f "$RUNNER_TEMP/akif_kernel/vendor_dlkm/gt9896s.ko" "$DEVICE_PATH/recovery/root/lib/modules/" 2>/dev/null || true
          cp -f "$RUNNER_TEMP/akif_kernel/vendor_dlkm/gt9886.ko" "$DEVICE_PATH/recovery/root/lib/modules/" 2>/dev/null || true
          cp -f "$RUNNER_TEMP/akif_kernel/ramdisk/modules.dep" "$DEVICE_PATH/recovery/root/lib/modules/modules.dep"
          cp -f "$RUNNER_TEMP/akif_kernel/ramdisk/modules.alias" "$DEVICE_PATH/recovery/root/lib/modules/modules.alias"

          # 4. Override common fstab & init.recovery.mt6789.rc with our universal Android 12-17 versions
          cp -f "$DEVICE_PATH/recovery/root/first_stage_ramdisk/fstab.mt6789" "$COMMON_PATH/recovery/root/first_stage_ramdisk/fstab.mt6789"
          cp -f "$DEVICE_PATH/recovery/root/system/etc/recovery.fstab" "$COMMON_PATH/recovery/root/system/etc/recovery.fstab"
          cp -f "$DEVICE_PATH/recovery/root/system/etc/twrp.flags" "$COMMON_PATH/recovery/root/system/etc/twrp.flags"
          cp -f "$DEVICE_PATH/recovery/root/init.recovery.mt6789.rc" "$COMMON_PATH/recovery/root/init.recovery.mt6789.rc"
          cp -f "$DEVICE_PATH/recovery/root/init.tee.rc" "$COMMON_PATH/recovery/root/init.tee.rc"
          cp -f "$DEVICE_PATH/recovery/root/system/etc/task_profiles.json" "$COMMON_PATH/recovery/root/system/etc/task_profiles.json"

          # 5. Prevent HIDL bootcontrol deadlock by setting passthrough transport in VINTF manifest
          if [ -f "$COMMON_PATH/recovery/root/vendor/etc/vintf/manifest/android.hardware.boot@1.2.xml" ]; then
            sed -i 's/<transport>hwbinder<\/transport>/<transport>passthrough<\/transport>/g' "$COMMON_PATH/recovery/root/vendor/etc/vintf/manifest/android.hardware.boot@1.2.xml"
          fi

          # Ensure sbin and linkerconfig directories exist for OrangeFox 14.1 post-build script
          mkdir -p "$DEVICE_PATH/recovery/root/sbin" "$DEVICE_PATH/recovery/root/linkerconfig"
          touch "$DEVICE_PATH/recovery/root/sbin/.keep" "$DEVICE_PATH/recovery/root/linkerconfig/.keep"

          # Disable external clone in vendorsetup.sh since we already cloned common tree above
          rm -f "$DEVICE_PATH/vendorsetup.sh"

      - name: Preflight Verification
        shell: bash
        run: |
          set -euxo pipefail
          cd "$FOX_ROOT"
          test -f "$DEVICE_PATH/AndroidProducts.mk"
          test -f "$DEVICE_PATH/BoardConfig.mk"
          test -f "$DEVICE_PATH/device.mk"
          test -f "$DEVICE_PATH/twrp_X678B.mk"
          test -f "$DEVICE_PATH/init/init_Infinix-X678B.cpp"
          test -s "$DEVICE_PATH/prebuilt/dtb.img"
          test -s "$DEVICE_PATH/recovery/root/lib/modules/modules.load"
          test -s "$DEVICE_PATH/recovery/root/lib/modules/modules.load.recovery"
          ! grep -Eq 'clk-disable-unused\.ko|mtk-pm-domain-disable-unused\.ko' "$DEVICE_PATH/recovery/root/lib/modules/modules.load"
          ! grep -Eq 'clk-disable-unused\.ko|mtk-pm-domain-disable-unused\.ko' "$DEVICE_PATH/recovery/root/lib/modules/modules.load.recovery"
          grep -q 'TARGET_COPY_OUT_VENDOR_RAMDISK' "$DEVICE_PATH/device.mk"
          ! grep -Eq 'start boot-hal-1-2|exec u:r:update_engine' "$DEVICE_PATH/recovery/root/init.recovery.mt6789.rc"
          test -s "$DEVICE_PATH/recovery/root/init.tee.rc"
          ! grep -q '/dev/block/bootdevice/by-name/system' "$DEVICE_PATH/recovery/root/system/etc/twrp.flags"
          test -s "$DEVICE_PATH/recovery/root/lib/modules/ft3681_common.ko"
          test -s "$DEVICE_PATH/recovery/root/lib/modules/gt9896s.ko"
          test -s "$DEVICE_PATH/recovery/root/lib/modules/gt9886.ko"
          grep -q 'gt9896s.ko' "$DEVICE_PATH/recovery/root/lib/modules/modules.load.recovery"
          grep -q 'gt9886.ko' "$DEVICE_PATH/recovery/root/lib/modules/modules.load.recovery"
          test -s "$DEVICE_PATH/recovery/root/lib/modules/hl7138.ko"
          test -s "$DEVICE_PATH/recovery/root/lib/modules/mtk_chg_det.ko"
          test -s "$DEVICE_PATH/recovery/root/vendor/firmware/focaltech_ts_fw.bin"
          test -s "$COMMON_PATH/BoardConfigCommon.mk"
          test -s "$COMMON_PATH/recovery/root/first_stage_ramdisk/fstab.mt6789"
          test -s "$COMMON_PATH/recovery/root/system/etc/task_profiles.json"
          ! grep -Eq 'gsi_keys\.mk|PRODUCT_TARGET_VNDK_VERSION|TW_RECOVERY_ADDITIONAL_RELINK_LIBRARY_FILES' "$COMMON_PATH/common.mk"
          ! grep -Eq 'device_kernel_headers' "$COMMON_PATH/bootctrl/Android.bp"
          grep -q 'OF_DEFAULT_KEYMASTER_VERSION' "$DEVICE_PATH/BoardConfig.mk"
          grep -q 'OF_DEFAULT_KEYMASTER_VERSION' "$COMMON_PATH/BoardConfigCommon.mk"
          ! grep -q 'TW_INCLUDE_LPTOOLS := true' "$DEVICE_PATH/BoardConfig.mk"
          ! grep -q 'TW_INCLUDE_LPTOOLS := true' "$COMMON_PATH/BoardConfigCommon.mk"
          cat "$DEVICE_PATH/AndroidProducts.mk"
          cat "$COMMON_PATH/common.mk"

      - name: Build OrangeFox vendor_boot image
        shell: bash
        run: |
          set -euo pipefail
          cd "$FOX_ROOT"
          mkdir -p "$GITHUB_WORKSPACE/output"
          set +u
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE="X678B"
          export FOX_TARGET_DEVICES="Infinix-X678B,X678B,satire"
          export OF_NO_TREBLE_COMPATIBILITY_CHECK=1
          export OF_IGNORE_LOGICAL_MOUNT_ERRORS=1
          export OF_DISABLE_MIUI_OTA_BY_DEFAULT=1
          export OF_DEFAULT_KEYMASTER_VERSION="4.1"
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_VANILLA_BUILD=1
          export LC_ALL=C

          # Disable Windows host cross-compilation in AOSP so Soong never attempts to build Windows host DLLs/targets
          find build -name "envsetup.mk" -exec sed -i 's/HOST_CROSS_OS := windows/HOST_CROSS_OS :=/g' {} + 2>/dev/null || true
          export HOST_CROSS_OS=""

          source build/envsetup.sh

          if [ "$FOX_BRANCH" = "14.1" ]; then
            lunch "${PRODUCT_NAME}-ap2a-eng"
          else
            lunch "${PRODUCT_NAME}-eng"
          fi

          # Ensure /tmp/X678B/fox_env.sh and /tmp/Infinix-X678B/fox_env.sh both exist for OrangeFox_A14.sh
          mkdir -p /tmp/X678B /tmp/Infinix-X678B
          if [ -f /tmp/X678B/fox_env.sh ] && [ ! -f /tmp/Infinix-X678B/fox_env.sh ]; then
            cp -f /tmp/X678B/fox_env.sh /tmp/Infinix-X678B/fox_env.sh
          elif [ -f /tmp/Infinix-X678B/fox_env.sh ] && [ ! -f /tmp/X678B/fox_env.sh ]; then
            cp -f /tmp/Infinix-X678B/fox_env.sh /tmp/X678B/fox_env.sh
          fi

          # Build OrangeFox vendor_boot image directly (automatically compiles all device packages without host cross-compilation)
          mka adbd vendorbootimage 2>&1 | tee "$GITHUB_WORKSPACE/output/build-vendorboot.log"

          # Verify generated vendor_boot.img and ramdisk contents
          test -s "$FOX_ROOT/out/target/product/$DEVICE_NAME/vendor_boot.img"
          echo "vendor_boot.img generated successfully:"
          ls -lh "$FOX_ROOT/out/target/product/$DEVICE_NAME/vendor_boot.img"
          test -s "$FOX_ROOT/out/target/product/$DEVICE_NAME/vendor_ramdisk/first_stage_ramdisk/fstab.mt6789" || true
          test -s "$FOX_ROOT/out/target/product/$DEVICE_NAME/vendor_ramdisk/lib/modules/modules.load" || true
          test -s "$FOX_ROOT/out/target/product/$DEVICE_NAME/vendor_ramdisk/lib/modules/ufs-mediatek-mod.ko" || true
          test -s "$FOX_ROOT/out/target/product/$DEVICE_NAME/recovery/root/first_stage_ramdisk/fstab.mt6789" || true
          test -s "$FOX_ROOT/out/target/product/$DEVICE_NAME/recovery/root/lib/modules/ft3681_common.ko" || true
          test -s "$FOX_ROOT/out/target/product/$DEVICE_NAME/recovery/root/lib/modules/gt9896s.ko" || true

      - name: Collect Output Images
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/output"
          cd "$FOX_ROOT/out/target/product/$DEVICE_NAME" 2>/dev/null || exit 0
          for f in vendor_boot.img OrangeFox*.img OrangeFox*.zip ramdisk-recovery.cpio; do
            if [ -f "$f" ]; then
              cp -f "$f" "$GITHUB_WORKSPACE/output/"
            fi
          done
          ls -lh "$GITHUB_WORKSPACE/output/"

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ env.FOX_BRANCH }}-Infinix-X678B-vendor_boot
          path: output/*
          if-no-files-found: warn
          retention-days: 14
