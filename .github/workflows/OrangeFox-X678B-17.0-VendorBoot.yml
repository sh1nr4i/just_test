name: OrangeFox 13.1 - Infinix X678B (17.0 tree, vendor_boot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build X678B vendor_boot with OrangeFox 14.1
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FOX_BRANCH: '14.1'
      DEVICE_REPO: 'https://github.com/akifakif32/android_device_infinix_X678B.git'
      DEVICE_BRANCH: '17.0'
      VENDOR_REPO: 'https://github.com/akifakif32/android_vendor_infinix_X678B.git'
      VENDOR_BRANCH: '17.0'
      MODULES_REPO: 'https://github.com/akifakif32/android_device_infinix_X678B-kernel.git'
      MODULES_BRANCH: 'sixteen-mck'
      COMMON_KERNEL_REPO: 'https://github.com/MillenniumOSS/android_device_millennium_common-kernel.git'
      COMMON_KERNEL_BRANCH: 'seventeen'
      SEPOLICY_REPO: 'https://github.com/LineageOS/android_device_mediatek_sepolicy_vndr.git'
      SEPOLICY_BRANCH: 'lineage-21'
      FOX_ROOT: '${{ github.workspace }}/OrangeFox/fox_14.1'
      DEVICE_PATH: 'device/infinix/X678B'
      VENDOR_PATH: 'vendor/infinix/X678B'
      MODULES_PATH: 'device/infinix/X678B-kernel'
      COMMON_KERNEL_PATH: 'device/millennium/common-kernel'
      SEPOLICY_PATH: 'device/mediatek/sepolicy_vndr'
      PRODUCT_NAME: 'omni_X678B'
      PRODUCT_DEVICE: 'X678B'

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt -y upgrade
          git clone --depth=1 https://gitlab.com/OrangeFox/misc/scripts "$RUNNER_TEMP/orangefox-scripts"
          cd "$RUNNER_TEMP/orangefox-scripts"
          sudo bash setup/android_build_env.sh

      - name: Sync OrangeFox 14.1 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"
          cd "$GITHUB_WORKSPACE/OrangeFox"
          git config --global user.name 'OrangeFox Builder'
          git config --global user.email 'orangefox-builder@users.noreply.github.com'
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$FOX_ROOT"

      - name: Clone the requested 17.0 device tree and its referenced dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$FOX_ROOT"
          git clone --depth=1 --single-branch --branch "$DEVICE_BRANCH" "$DEVICE_REPO" "$DEVICE_PATH"
          git clone --depth=1 --single-branch --branch "$VENDOR_BRANCH" "$VENDOR_REPO" "$VENDOR_PATH"
          git clone --depth=1 --single-branch --branch "$MODULES_BRANCH" "$MODULES_REPO" "$MODULES_PATH"
          git clone --depth=1 --single-branch --branch "$COMMON_KERNEL_BRANCH" "$COMMON_KERNEL_REPO" "$COMMON_KERNEL_PATH"
          git clone --depth=1 --single-branch --branch "$SEPOLICY_BRANCH" "$SEPOLICY_REPO" "$SEPOLICY_PATH"

          if [[ -f "$DEVICE_PATH/vendorsetup.sh" ]]; then
            mv "$DEVICE_PATH/vendorsetup.sh" "$DEVICE_PATH/vendorsetup.sh.rom-only-disabled"
          fi

          echo "DEVICE_TREE_COMMIT=$(git -C "$DEVICE_PATH" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VENDOR_TREE_COMMIT=$(git -C "$VENDOR_PATH" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MODULES_TREE_COMMIT=$(git -C "$MODULES_PATH" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "COMMON_KERNEL_COMMIT=$(git -C "$COMMON_KERNEL_PATH" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SEPOLICY_COMMIT=$(git -C "$SEPOLICY_PATH" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create a recovery-only Omni product and register it
        shell: bash
        run: |
          set -euo pipefail
          cd "$FOX_ROOT"

          cat > "$DEVICE_PATH/omni_X678B.mk" <<'EOF'
          $(call inherit-product, vendor/omni/config/common.mk)
          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit_only.mk)

          PRODUCT_NAME := omni_X678B
          PRODUCT_DEVICE := X678B
          PRODUCT_BRAND := Infinix
          PRODUCT_MODEL := Infinix X678B
          PRODUCT_MANUFACTURER := Infinix
          PRODUCT_GMS_CLIENTID_BASE := android-infinix

          PRODUCT_SOONG_NAMESPACES += device/infinix/X678B
          PRODUCT_PACKAGES += \
              fstab.mt6789 \
              init_connectivity.rc \
              init.connectivity.common.rc \
              init.connectivity.rc \
              init.insmod.sh \
              init.insmod.mt6789.cfg \
              init.modem.rc \
              init.mt6789.power.rc \
              init.mt6789.rc \
              init.mt6789.usb.rc \
              init.mtkgki.rc \
              init.project.rc \
              init.recovery.usb.rc \
              init.sensor_2_0.rc \
              ueventd.mt6789.rc
          EOF

          python3 - "$DEVICE_PATH/AndroidProducts.mk" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          content = path.read_text()
          product_line = "$(LOCAL_DIR)/omni_X678B.mk"
          if product_line not in content:
              content += "\n\nPRODUCT_MAKEFILES += \\\n              " + product_line + "\n"
          lunch_choice = "omni_X678B-trunk_staging-eng"
          if lunch_choice not in content:
              content += "\nCOMMON_LUNCH_CHOICES += \\\n              " + lunch_choice + "\n"
          path.write_text(content)
          print(path.read_text())
          PY

      - name: Validate 17.0 tree and vendor_boot prerequisites before compiling
        shell: bash
        run: |
          set -euo pipefail
          cd "$FOX_ROOT"
          test -f "$DEVICE_PATH/AndroidProducts.mk"
          test -f "$DEVICE_PATH/BoardConfig.mk"
          test -f "$DEVICE_PATH/rootdir/etc/fstab.mt6789"
          test -f "$VENDOR_PATH/BoardConfigVendor.mk"
          test -f "$SEPOLICY_PATH/SEPolicy.mk"
          test -s "$COMMON_KERNEL_PATH/chihiro/Image.gz"
          test -s "$MODULES_PATH/dtbo.img"
          test -d "$MODULES_PATH/dtb"
          test -s "$MODULES_PATH/ramdisk/modules.load"
          test -s "$MODULES_PATH/ramdisk/modules.load.recovery"
          test -s "$MODULES_PATH/vendor_dlkm/modules.load"
          test -f vendor/omni/config/common.mk

          grep -Eq '^BOARD_BOOT_HEADER_VERSION[[:space:]]*:=[[:space:]]*4' "$DEVICE_PATH/BoardConfig.mk"
          grep -Eq '^BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE[[:space:]]*:=[[:space:]]*67108864' "$DEVICE_PATH/BoardConfig.mk"
          grep -Eq '^BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT[[:space:]]*:=[[:space:]]*true' "$DEVICE_PATH/BoardConfig.mk"
          grep -Eq '^BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT[[:space:]]*:=[[:space:]]*true' "$DEVICE_PATH/BoardConfig.mk"

          for list in ramdisk/modules.load ramdisk/modules.load.recovery; do
            while IFS= read -r module || [[ -n "$module" ]]; do
              module="${module%%#*}"
              module="$(echo "$module" | xargs)"
              [[ -z "$module" ]] && continue
              test -f "$MODULES_PATH/ramdisk/$module" || {
                echo "Missing module referenced by $list: $MODULES_PATH/ramdisk/$module" >&2
                exit 1
              }
            done < "$MODULES_PATH/$list"
          done
          while IFS= read -r module || [[ -n "$module" ]]; do
            module="${module%%#*}"
            module="$(echo "$module" | xargs)"
            [[ -z "$module" ]] && continue
            test -f "$MODULES_PATH/vendor_dlkm/$module" || {
              echo "Missing vendor_dlkm module: $MODULES_PATH/vendor_dlkm/$module" >&2
              exit 1
            }
          done < "$MODULES_PATH/vendor_dlkm/modules.load"

          echo 'Preflight passed. Building vendor_boot; no make clean is run on a fresh runner.'

      - name: Select the recovery product using the current lunch syntax
        shell: bash
        run: |
          set -euo pipefail
          cd "$FOX_ROOT"
          set +u
          source build/envsetup.sh
          set -u
          lunch "$PRODUCT_NAME" trunk_staging eng
          echo "TARGET_PRODUCT=$(get_build_var TARGET_PRODUCT)" >> "$GITHUB_ENV"
          echo "TARGET_DEVICE=$(get_build_var TARGET_DEVICE)" >> "$GITHUB_ENV"

      - name: Build vendor_boot image
        shell: bash
        run: |
          set -euo pipefail
          cd "$FOX_ROOT"
          mkdir -p "$GITHUB_WORKSPACE/output"
          set +u
          source build/envsetup.sh
          set -u
          lunch "$PRODUCT_NAME" trunk_staging eng
          mka vendorbootimage 2>&1 | tee "$GITHUB_WORKSPACE/output/build-vendorboot.log"

      - name: Collect images and build metadata
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/output"
          cd "$FOX_ROOT" 2>/dev/null || exit 0
          find out/target/product -type f \( -name 'vendor_boot.img' -o -name 'vendor_boot-debug.img' -o -name 'OrangeFox*.img' \) -size +0c -print 2>/dev/null | while IFS= read -r image; do
            cp -f "$image" "$GITHUB_WORKSPACE/output/$(basename "$image")"
          done
          cat > "$GITHUB_WORKSPACE/output/build-info.txt" <<EOF
          OrangeFox manifest: $FOX_BRANCH
          Device tree: $DEVICE_REPO ($DEVICE_BRANCH)
          Device tree commit: $DEVICE_TREE_COMMIT
          Vendor tree: $VENDOR_REPO ($VENDOR_BRANCH)
          Vendor tree commit: $VENDOR_TREE_COMMIT
          Kernel modules tree: $MODULES_REPO ($MODULES_BRANCH)
          Kernel modules commit: $MODULES_TREE_COMMIT
          Common kernel tree: $COMMON_KERNEL_REPO ($COMMON_KERNEL_BRANCH)
          Common kernel commit: $COMMON_KERNEL_COMMIT
          SEPolicy tree: $SEPOLICY_REPO ($SEPOLICY_BRANCH)
          SEPolicy commit: $SEPOLICY_COMMIT
          Product: $PRODUCT_NAME
          Target: vendorbootimage
          Note: build success and device bootability must be tested independently.
          EOF

      - name: Upload vendor_boot output and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-14.1-X678B-17.0-vendor_boot
          path: output/*
          if-no-files-found: warn
          retention-days: 7
